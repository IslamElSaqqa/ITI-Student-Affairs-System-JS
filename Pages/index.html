<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student-Affairs-System</title>
    <link rel="stylesheet" href="../styles/app-style.css" />
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar">
    <div class="nav-container">
        <div class="nav-logo">
            <img src="https://res.cloudinary.com/dr9yx1tod/image/upload/v1770162727/Students-Affaiirs-System_up7kax.png" alt="Student Affairs Logo" />
        </div>
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="#" class="nav-link active" data-entity="students">Students</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link" data-entity="instructors">Instructors</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link" data-entity="employees">Employees</a>
            </li>
        </ul>
    </div>
</nav>

<div class="container">

    <h1 id="pageTitle">Student System</h1>
    <div id="errorMessage" class="error-message"></div>
    <form id="entityForm">
        <!-- Form fields will be dynamically rendered based on entity type -->
    </form>

    <div class="table-controls">
        <div class="entries">
            <select id="entriesSelect">
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="25">25</option>
            </select>
            <span>entries per page</span>
        </div>

        <div class="search-box">
            <label>Search:</label>
            <input type="text" id="searchInput" placeholder="Search by name..." />
        </div>
    </div>

    <table id="entityTable">
        <thead>
            <tr id="tableHeader">
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <!-- Pagination Controls -->
    <div class="pagination-container">
        <div class="pagination-info">
            Showing <span id="pageInfo"></span>
        </div>
        <div class="pagination-buttons" id="paginationButtons">
            <!-- Pagination buttons will be rendered dynamically -->
        </div>
    </div>

</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script type="module" src="../src/main.js"></script>
</body>
</html>
