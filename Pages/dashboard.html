<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-light">

<div class="container mt-4">

    <h2 class="mb-4">Analytics Dashboard</h2>

    <!-- KPI CARDS -->
    <div class="row" id="kpiCards">

        <div class="col-md-4">
            <div class="card shadow p-3">
                <h5>Total Students</h5>
                <h2 id="studentCount">0</h2>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow p-3">
                <h5>Total Instructors</h5>
                <h2 id="instructorCount">0</h2>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow p-3">
                <h5>Total Employees</h5>
                <h2 id="employeeCount">0</h2>
            </div>
        </div>

        <div class="col-md-4 mt-3">
            <div class="card shadow p-3">
                <h5>Total Courses</h5>
                <h2 id="courseCount">0</h2>
            </div>
        </div>
    </div>

    <!-- CHART -->
    <div class="row mt-5">

    <!-- Student Bar Chart -->
    <div class="col-md-6 d-flex">
        <div class="card shadow p-4 w-100 chart-card">
            <h5 class="mb-3">Students Age Distribution</h5>

            <div class="chart-wrapper">
                <canvas id="studentAgeChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Department Pie Chart -->
    <div class="col-md-6 d-flex">
        <div class="card shadow p-4 w-100 chart-card">
            <h5 class="mb-3">Instructors Per Department</h5>

            <div class="chart-wrapper">
                <canvas id="departmentPieChart"></canvas>
            </div>
        </div>
    </div>

</div>

</div>
</div>

<script type="module" src="../src/controllers/dashboardController.js"></script>

</body>
</html>
